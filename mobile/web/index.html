    <title>Reverse Picks — Elite Prop Intelligence</title>
    <meta name="description" content="Data-driven soccer player prop analytics. Deterministic projections, Bayesian summaries, and structured analysis to help you make smarter picks." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/rp-icon.png" />
    <link rel="shortcut icon" href="/rp-icon.png" />
    <link rel="apple-touch-icon" href="/rp-icon.png" />

    <!-- Open Graph / Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://reversepicks.com/" />
    <meta property="og:title" content="Reverse Picks — Elite Prop Intelligence" />
    <meta property="og:description" content="Deterministic soccer player prop analytics. Bayesian projections, structured analysis, and data-driven predictions." />
    <meta property="og:image" content="https://reversepicks.com/rp-icon.png" />
    <meta property="og:site_name" content="Reverse Picks" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Reverse Picks — Elite Prop Intelligence" />
    <meta name="twitter:description" content="Deterministic soccer player prop analytics. Bayesian projections, structured analysis, and data-driven predictions." />
    <meta name="twitter:image" content="https://reversepicks.com/rp-icon.png" />

    <!-- PWA / App -->
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reverse Picks" />
    <link rel="manifest" href="/manifest.json" />

    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; background: #050505; }
      #root { display: flex; height: 100%; flex: 1; }

      /* Remove ALL blue focus outlines on inputs — keeps the dark premium feel */
      input, textarea, select {
        outline: none !important;
        -webkit-tap-highlight-color: transparent;
        caret-color: #39FF14;
      }
      input:focus, textarea:focus, select:focus {
        outline: none !important;
        box-shadow: none !important;
      }
      /* Remove iOS autofill blue tint */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus {
        -webkit-text-fill-color: #ffffff;
        -webkit-box-shadow: 0 0 0px 1000px #111111 inset !important;
        transition: background-color 5000s ease-in-out 0s;
        caret-color: #39FF14;
      }
      /* Prevent layout jump when scrollbars appear */
      * { box-sizing: border-box; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
