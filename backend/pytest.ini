[pytest]
# Default run: deterministic unit tests only — no live HTTP, no external provider calls.
# Run: cd backend && python3.12 -m pytest
testpaths = tests
norecursedirs = integration retired external
addopts = -q --tb=short

# Marker definitions
markers =
    integration: live HTTP requests to a running backend server
    external: live requests to external data providers (API-Football, BDL, StatsBomb, etc.)
